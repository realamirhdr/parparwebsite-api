name: Deploy to Azure

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Build and push Docker image
        run: |
          docker build -t ${{ secrets.APP_NAME }}:latest .
          az acr login --name ${{ secrets.AZURE_ACR }}
          docker tag myapp:latest ${{ secrets.AZURE_ACR }}.azurecr.io/myapp:latest
          docker push ${{ secrets.AZURE_ACR }}.azurecr.io/myapp:latest

      - name: Deploy to Container App
        run: |
          az containerapp update \
            --name ${{ secrets.APP_NAME }} \
            --resource-group ${{ secrets.RESOURCE_GROUP }} \
            --image ${{ secrets.AZURE_ACR }}.azurecr.io/myapp:latest
